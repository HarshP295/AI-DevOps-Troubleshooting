spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/devops_rag?options=-c%20timezone=Asia/Kolkata
    username: devops_user
    password: devops_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: true